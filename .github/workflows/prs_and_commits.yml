# Workflow to check pull requests and new commits to main branches
# This checks the source in the state as if after the merge.
name: Pull request checks
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# Disallow concurrent runs for the same PR by cancelling in-progress runs
# when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven

      - name: Calc load
        run: |
          echo "load=$(uptime | cut -d, -f3 | cut -d: -f2 | xargs)" >> $GITHUB_OUTPUT;
          echo "nproc=$(nproc)" >> $GITHUB_OUTPUT;
        id: project


      - name: Build (Maven)
        env:
          NPROC: ${{ steps.project.outputs.nproc }}
          LOAD: ${{ steps.project.outputs.load }}
        run:  mvn -ntp -P ci clean install -DskipITs

      - name: Upload test results (Maven)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            **/target/*-reports/*
            **/target/site/*
            **/target/jacoco.exec
          name: test-results
          retention-days: 1

      - name: Execute integration tests (Maven)
        env:
          # Necessary for client builder integration tests that run with
          # default application credentials
          CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/creds.json
          KCBQ_TEST_KEYFILE:    /tmp/creds.json
          KCBQ_TEST_KEY_SOURCE: FILE
          KCBQ_TEST_PROJECT:    ${{ secrets.KCBQ_TEST_PROJECT }}
          KCBQ_TEST_DATASET:    ${{ secrets.KCBQ_TEST_DATASET }}
          KCBQ_TEST_BUCKET:     ${{ secrets.KCBQ_TEST_BUCKET }}
        #if:  KCBQ_TEST_PROJECT != ''
        run: |
          echo "$CREDENTIALS_JSON" > /tmp/creds.json
          export KCBQ_TEST_TABLE_SUFFIX=_$(date +%s)_$RANDOM
          mvn -ntp -P ci verify
      - name: Upload integration test results (Maven)
        env:
          KCBQ_TEST_PROJECT: ${{ secrets.KCBQ_TEST_PROJECT }}
        #if: KCBQ_TEST_PROJECT != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            **/target/*-reports/*
            **/target/site/*
            **/target/jacoco.exec
          name: integration-test-results
          retention-days: 1
